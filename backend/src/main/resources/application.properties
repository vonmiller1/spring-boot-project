# ------------------------------
# - server
# ------------------------------

server.port=8080

# ------------------------------
# - logging
# ------------------------------

logging.level.org.springframework.web=INFO

# ------------------------------
# - Spring DevTools remote (optional)
# Set DEVTOOLS_REMOTE_SECRET in the environment; never commit a real value.
# ------------------------------

spring.devtools.remote.secret=${DEVTOOLS_REMOTE_SECRET:}
